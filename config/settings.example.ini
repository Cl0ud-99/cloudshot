# Cloudshot settings —— 示例文件
# 实际配置在 %APPDATA%\Cloudshot\settings.ini，由程序自己维护。
# 这里的 config/ 目录只是历史留档，程序运行时不读它。
#
# hotkey_modifiers: 1=Alt, 2=Ctrl, 4=Shift, 8=Win（可相加）
# hotkey_key: 虚拟键码，65 = 'A'
hotkey_modifiers=1
hotkey_key=65
translate_provider=youdao

# 有道凭据由程序用 DPAPI 按「当前 Windows 用户」加密后写入，
# 换机器/换用户都解不开，因此不要在这里填明文，也不要把密文提交进仓库。
# 配置方式：托盘右键 →「设置...」→ 翻译服务，或命令行
#   Cloudshot.exe --set-youdao <AppID> <密钥>
youdao_appkey_enc=
youdao_secret_enc=
